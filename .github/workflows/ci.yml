name: ci

on:
  pull_request:
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # cache: Cargo and npm dependency caches are provided by the runner image when available.
      - name: Ensure pinned jankurai
        run: bash ops/ci/ensure-jankurai.sh
      - name: PR CI (canonical gate)
        # The proof lane needs the forge's protected main; the forge's own
        # jeryu-intelligence/required runs it. Everything else runs here.
        run: bash ops/ci/pr-ci.sh --without-proof-lane
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-audit-artifacts
          # language-bad-behavior.log is listed for Jankurai's bad-behavior
          # adoption check (an artifact upload reference); the audit itself
          # evaluates those detectors.
          path: |
            .jankurai/
            target/jankurai/
            target/jankurai/migration-report.json
            target/jankurai/baseline-migration-report.json
            target/jankurai/accepted-baseline.json
            target/jankurai/proof-ratchet-score.json
            target/jankurai/proof-ratchet-score.md
            target/jankurai/proof-evidence-summary.json
            target/jankurai/rust/witness-graph.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/copy-code.md
            target/jankurai/copy-code.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/security/evidence.json
            target/jankurai/repair-queue.jsonl
            target/jankurai/repo-score.md
            target/jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/repo-score.json
            target/artifact-support/
          if-no-files-found: ignore
