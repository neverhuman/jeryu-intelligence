name: Jankurai score

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jankurai-score-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    name: jankurai audit + badge --check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JANKURAI_TAG: v1.6.11-deadlang-precision-split.3
      JANKURAI_VERSION: jankurai 1.6.11
      JANKURAI_SHA256: 9e6b8857a26f6004d4c74e510e13b06d880f2e2ae0c89502698889ed690c5d6c
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Jankurai 1.6.11
        run: bash ops/ci/install-jankurai-release.sh
      - name: Audit and badge check
        run: bash ops/ci/jankurai-score.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jankurai-score
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            agent/jankurai-badge.svg
            agent/jankurai-badge.json

  badge-sync:
    name: auto-insert generated badge
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: score
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      JANKURAI_TAG: v1.6.11-deadlang-precision-split.3
      JANKURAI_VERSION: jankurai 1.6.11
      JANKURAI_SHA256: 9e6b8857a26f6004d4c74e510e13b06d880f2e2ae0c89502698889ed690c5d6c
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install pinned Jankurai 1.6.11
        run: bash ops/ci/install-jankurai-release.sh
      - name: Update generated badge files
        run: bash ops/ci/jankurai-badge-sync.sh
